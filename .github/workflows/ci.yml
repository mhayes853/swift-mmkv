name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: swift:6.3.3
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default traits
            traits: ""
          # The store alone. Nothing in the library may load Foundation without its trait.
          - name: lean
            traits: "--disable-default-traits"
            forbidden-modules: "Foundation|FoundationEssentials|FoundationInternationalization"
          # The suite against the Swift core that is replacing the C++ one. See
          # Docs/swift-core-migration.md.
          - name: Swift core
            traits: ""
            engine: swift
    steps:
      - uses: actions/checkout@v4

      # The MMKV core computes its checksums with the system zlib.
      - name: Install zlib
        run: |
          apt-get update
          apt-get install -y --no-install-recommends zlib1g-dev

      - name: Test
        run: swift test ${{ matrix.traits }}
        env:
          SWIFTMMKV_TEST_ENGINE: ${{ matrix.engine || 'cxx' }}

      # A symbol the core defines under its upstream name would collide with the copy of MMKV
      # that react-native-mmkv links into the same app.
      - name: Check core symbols are renamed
        run: Scripts/check-symbols.sh

      # The compiler checks what the C interface implements against its header, but not that
      # everything the header declares is implemented.
      - name: Check the C interface is implemented
        run: Scripts/check-c-interface.sh

      # The compiler's dependency files list every module the library's sources loaded, which is
      # what shows the trait kept Foundation out.
      - name: Check loaded Foundation modules
        if: matrix.forbidden-modules
        run: |
          loaded=$(cat .build/debug/SwiftMMKV.build/*.d .build/debug/SwiftMMKVC.build/*.d \
            | tr ' ' '\n' \
            | grep -oE '[A-Za-z_]+\.swiftmodule' | sed 's/\.swiftmodule$//' | sort -u)
          if echo "$loaded" | grep -xE '${{ matrix.forbidden-modules }}'; then
            echo "The library loaded a Foundation module this configuration must not use." >&2
            exit 1
          fi

  test-macos:
    name: macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test
        run: swift test

      - name: Test without traits
        run: swift test --disable-default-traits

      - name: Test with swift-sharing
        run: swift test --traits Sharing,Foundation

      - name: Test with swift-log
        run: swift test --traits Logging,Foundation

      - name: Test with swift-uuidv7
        run: swift test --traits UUIDV7,Foundation

      - name: Test with swift-uuidv7 and without Foundation
        run: swift test --traits UUIDV7

      - name: Test with swift-tagged
        run: swift test --traits Tagged,Foundation

      - name: Test with swift-tagged and without Foundation
        run: swift test --traits Tagged

      # The same suite against the Swift core that is replacing the C++ one. Tests for features
      # it does not have yet are skipped. See Docs/swift-core-migration.md.
      - name: Test the Swift core
        run: swift test --traits Sharing,Foundation,Logging,UUIDV7,Tagged
        env:
          SWIFTMMKV_TEST_ENGINE: swift

      - name: Check core symbols are renamed
        run: Scripts/check-symbols.sh

      # Keeps the benchmarks compiling. They are run by hand; see Benchmarks/README.md.
      - name: Build benchmarks
        run: swift build --package-path Benchmarks -c release
        env:
          BENCHMARK_DISABLE_JEMALLOC: "1"

      - name: Check the C interface is implemented
        run: Scripts/check-c-interface.sh

  test-ios:
    name: iOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # With more than one product, Xcode names the scheme that builds and tests all of them
      # after the package, with this suffix.
      - name: Test
        run: |
          xcodebuild test \
            -scheme swift-mmkv-Package \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest'

  build-android:
    name: Android (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Swift package for Android
        uses: swift-android-sdk/swift-android-action@v2
        with:
          swift-version: '6.4.0'
          build-tests: false
          run-tests: false
      - name: Build Swift package for Android with the Sharing, Logging, UUIDV7 and Tagged traits
        uses: swift-android-sdk/swift-android-action@v2
        with:
          swift-version: '6.4.0'
          swift-build-flags: --traits Sharing,Logging,UUIDV7,Tagged,Foundation
          build-tests: false
          run-tests: false
