[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "swiftmmkv"
version = "0.1.0"
description = "Python bindings for swift-mmkv, a wrapper around the core of MMKV, Tencent's memory-mapped key-value store."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["mmkv", "key-value", "storage", "mmap"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/mhayes853/swift-mmkv"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/swiftmmkv"]
# The library is built into the source tree, where git ignores it.
artifacts = ["src/swiftmmkv/_lib/*"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.mypy]
strict = true
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "I"]
